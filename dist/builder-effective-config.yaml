directories:
  output: dist
  buildResources: build
appId: com.kapsul.kocluk-programi
productName: Kapsul Koçluk Programı
files:
  - filter:
      - '**/*'
      - '!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}'
      - '!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}'
      - '!**/node_modules/*.d.ts'
      - '!**/node_modules/.bin'
      - '!**/*.{o,h,obj,py,rb,sh,swp,cs,sln,suo,xcode,svn,git,vscode,md}'
      - '!dist/**/*'
      - '!build/**/*'
win:
  target:
    - target: nsis
      arch:
        - x64
        - ia32
    - target: portable
      arch:
        - x64
        - ia32
  icon: Kapsül-Photoroom.png
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: Kapsül-Photoroom.png
  category: public.app-category.education
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  icon: Kapsül-Photoroom.png
  category: Education
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Kapsul Koçluk Programı
electronVersion: 37.3.1
